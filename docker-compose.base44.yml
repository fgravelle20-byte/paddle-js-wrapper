services:
  demo:
    image: node:22-slim
    working_dir: /app
    volumes:
      - ./:/app
    ports:
      - "3000:5173"
    environment:
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    command:
      - sh
      - -ec
      - |
        yarn install --frozen-lockfile
        yarn build
        cd demo && npm install
        exec ./node_modules/.bin/vite --host 0.0.0.0 --port 5173
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 90s
    restart: on-failure
